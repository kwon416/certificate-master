version: "3.9"

services:
  # Backend API (FastAPI) - Docker 배포
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: cert-master-backend
    restart: unless-stopped
    network_mode: host  # 호스트 네트워크 사용 (MySQL 권한 문제 해결)
    env_file:
      - ../backend/.env
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=https://dev-cert.i-ve.ai,http://localhost:3000
    # network_mode: host 사용 시 ports 불필요 (자동으로 8000 사용)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 로그 설정
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
